# 端到端测试用的数据库实例。二者任选其一：
#   docker compose up -d mysql8    → 127.0.0.1:3306
#   docker compose up -d mariadb   → 127.0.0.1:3307
# 然后：
#   export MYSQL_HOST=127.0.0.1 MYSQL_PORT=3306 MYSQL_USER=root MYSQL_PASSWORD=secret
#   make e2e
services:
  mysql8:
    image: mysql:8.0
    container_name: signin-mysql8
    command: --cte-max-recursion-depth=1000000
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: signin_dsl_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb:
    image: mariadb:10.11
    container_name: signin-mariadb
    command: --max-recursive-iterations=1000000
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: signin_dsl_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
